<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>심부전 노트북</title>
<style>
  :root {
    --bg: #f4f2ec; --surface: #ffffff; --ink: #1c2430; --muted: #687385; --line: #e3e0d6;
    --accent: #2f5d50; --accent-soft: #e3efe9; --warn: #9a5b00; --warn-soft: #fdf1dc;
    --mark: #fff0a8; --shadow: 0 1px 2px rgba(28, 36, 48, .06);
    --serif: Georgia, "Noto Serif KR", "Batang", serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #13161b; --surface: #1b1f26; --ink: #e8eaee; --muted: #9aa4b4; --line: #2a303a;
      --accent: #7fc4ab; --accent-soft: #1d2f29; --warn: #e6b55a; --warn-soft: #33290f;
      --mark: #5b4f12; --shadow: none;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15.5px/1.65 "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  .app { height: 100vh; display: grid; grid-template-columns: 260px minmax(0, 1fr) 400px; }
  aside, main { min-height: 0; display: flex; flex-direction: column; }
  aside { background: var(--surface); }
  .sources { border-right: 1px solid var(--line); padding: 20px 16px; overflow-y: auto; }
  .evidence { border-left: 1px solid var(--line); overflow: hidden; }
  h2.pane { margin: 0 0 12px; font-size: 12px; letter-spacing: .08em; color: var(--muted); font-weight: 700; }

  /* 자료 목록 */
  .src { display: flex; gap: 10px; padding: 10px; border: 1px solid var(--line); border-radius: 10px; margin-bottom: 8px; cursor: pointer; background: var(--bg); }
  .src input { margin-top: 5px; accent-color: var(--accent); }
  .src b { display: block; font-size: 13.5px; line-height: 1.4; }
  .src small { color: var(--muted); font-size: 12px; }
  .src.on { border-color: var(--accent); background: var(--accent-soft); }
  .pri { display: inline-block; min-width: 16px; margin-right: 6px; padding: 0 4px; font: 700 11px/16px var(--mono); text-align: center; color: #fff; background: var(--accent); border-radius: 4px; }
  .hint { font-size: 12.5px; color: var(--muted); margin: 14px 2px 0; }

  /* 대화 */
  .top { padding: 16px 28px 12px; border-bottom: 1px solid var(--line); background: var(--surface); }
  .top h1 { margin: 0; font: 700 21px var(--serif); letter-spacing: -.01em; }
  .top p { margin: 2px 0 0; font-size: 13px; color: var(--muted); }
  .thread { flex: 1; min-height: 0; overflow-y: auto; padding: 24px 28px 8px; }
  .empty { max-width: 560px; margin: 8vh auto 0; text-align: center; color: var(--muted); }
  .empty h3 { font: 700 22px var(--serif); color: var(--ink); margin: 0 0 6px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 18px; }
  .chip { font-size: 13.5px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; }
  .chip:hover { border-color: var(--accent); color: var(--accent); }
  .turn { max-width: 760px; margin: 0 auto 26px; }
  .q { font-weight: 600; background: var(--surface); border: 1px solid var(--line); border-radius: 14px 14px 14px 4px; padding: 10px 16px; display: inline-block; max-width: 100%; }
  .a { margin-top: 12px; padding: 4px 4px 0; white-space: pre-wrap; overflow-wrap: anywhere; }
  .a.refused { color: var(--warn); background: var(--warn-soft); border-radius: 10px; padding: 12px 16px; }
  .turn.sel .a { outline: 0; }
  .meta { margin-top: 10px; font-size: 12.5px; color: var(--muted); display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
  .meta button { background: none; border: 1px solid var(--line); border-radius: 999px; padding: 2px 12px; font-size: 12.5px; color: var(--muted); }
  .turn.sel .meta button.view { border-color: var(--accent); color: var(--accent); }
  .cite { display: inline-block; min-width: 20px; padding: 0 5px; margin: 0 1px; font: 600 11.5px/18px var(--mono); text-align: center; color: var(--accent); background: var(--accent-soft); border: 1px solid transparent; border-radius: 9px; vertical-align: 1px; }
  .cite:hover { border-color: var(--accent); }
  .typing { display: inline-block; width: 8px; height: 15px; background: var(--accent); vertical-align: -2px; animation: blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .status { color: var(--muted); display: flex; gap: 10px; align-items: center; }
  .spin { width: 15px; height: 15px; border: 2px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: s .8s linear infinite; }
  @keyframes s { to { transform: rotate(360deg); } }
  .err { color: #b3261e; }

  .composer { padding: 12px 28px 18px; background: linear-gradient(transparent, var(--bg) 30%); }
  .composer .box { max-width: 760px; margin: 0 auto; display: flex; gap: 10px; align-items: flex-end; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 8px 8px 8px 16px; box-shadow: var(--shadow); }
  .composer .box:focus-within { border-color: var(--accent); }
  textarea { flex: 1; border: 0; outline: 0; resize: none; background: transparent; color: var(--ink); font: inherit; max-height: 140px; padding: 6px 0; }
  .send { background: var(--accent); color: #fff; border: 0; border-radius: 12px; padding: 8px 18px; font-weight: 600; }
  .send:disabled { opacity: .45; cursor: wait; }
  .note { max-width: 760px; margin: 6px auto 0; font-size: 12px; color: var(--muted); }

  /* 근거 패널 */
  .evidence .head { padding: 20px 18px 10px; }
  .evidence .head h2 { margin: 0; }
  .evidence .head p { margin: 4px 0 0; font-size: 12.5px; color: var(--muted); }
  #evList { flex: 1; min-height: 0; overflow-y: auto; padding: 4px 18px 28px; }
  .pcard { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin-bottom: 12px; background: var(--bg); }
  .pcard.cited { border-color: var(--accent); background: var(--surface); }
  .pcard.flash { animation: flash 1.4s; }
  @keyframes flash { 0%, 60% { box-shadow: 0 0 0 3px var(--accent); } 100% { box-shadow: 0 0 0 0 transparent; } }
  .phead { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; font-size: 12.5px; color: var(--muted); }
  .phead .num { font: 700 12px var(--mono); color: var(--accent); background: var(--accent-soft); border-radius: 6px; padding: 1px 7px; }
  .phead .sname { color: var(--ink); font-weight: 600; }
  .phead .rel { margin-left: auto; font-family: var(--mono); font-size: 11.5px; }
  .ptext { margin-top: 8px; font-size: 14px; line-height: 1.75; white-space: pre-wrap; overflow-wrap: anywhere; }
  .ptext mark.key { background: var(--mark); color: inherit; border-radius: 3px; padding: 1px 0; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
  .tbl tr.hit td, .tbl tr.hit th { background: var(--mark); color: var(--ink); }
  .pcard:not(.cited) .ptext { color: var(--muted); }
  .pfoot { margin-top: 8px; }
  .pfoot button { background: none; border: 0; padding: 0; color: var(--accent); font-size: 12.5px; text-decoration: underline; }
  .sub { font-size: 12px; font-weight: 700; color: var(--muted); letter-spacing: .06em; margin: 14px 0 8px; }
  .noev { color: var(--muted); font-size: 14px; padding: 18px 4px; }
  .kind { font: 600 11px var(--mono); color: var(--warn); background: var(--warn-soft); border-radius: 6px; padding: 1px 7px; }
  .tbl { margin-top: 8px; }
  .tbl .cap { font-weight: 600; font-size: 13.5px; margin-bottom: 6px; line-height: 1.5; }
  .twrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; }
  .tbl table { border-collapse: collapse; width: 100%; min-width: 520px; font-size: 12.5px; line-height: 1.55; }
  .tbl th, .tbl td { border-bottom: 1px solid var(--line); border-right: 1px solid var(--line); padding: 6px 8px; vertical-align: top; text-align: left; min-width: 5.5em; overflow-wrap: break-word; word-break: keep-all; }
  .a .tbl { margin: 10px 0; white-space: normal; }
  .a .tbl table { min-width: 0; }
  .a .tbl td { color: var(--ink); }
  .tbl th:last-child, .tbl td:last-child { border-right: 0; }
  .tbl tr:last-child td { border-bottom: 0; }
  .tbl th { background: var(--accent-soft); font-weight: 600; }
  .pcard:not(.cited) .tbl td { color: var(--muted); }

  /* 원문 PDF 뷰어 */
  dialog.viewer { width: min(1040px, 96vw); height: 94vh; max-height: 94vh; margin: auto; padding: 0; border: 1px solid var(--line); border-radius: 14px; background: var(--bg); color: var(--ink); overflow: hidden; }
  dialog.viewer[open] { display: flex; flex-direction: column; }
  dialog.viewer::backdrop { background: rgba(0, 0, 0, .55); }
  .vbar { display: flex; align-items: center; gap: 10px; padding: 10px 14px; background: var(--surface); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .vbar .vt { flex: 1; min-width: 160px; line-height: 1.35; }
  .vbar .vt b { display: block; font-size: 14px; }
  .vbar .vt span { font: 12px var(--mono); color: var(--muted); }
  .vbtn { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 4px 11px; font-size: 14px; }
  .vbtn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  .vbtn:disabled { opacity: .35; cursor: default; }
  .vbtn.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
  .vbody { flex: 1; min-height: 0; overflow: auto; padding: 16px; background: #8b8f96; }
  @media (prefers-color-scheme: dark) { .vbody { background: #0d0f12; } }
  .vbox { position: relative; margin: 0 auto; }
  .vpage { position: relative; width: 100%; margin: 0 0 12px; background: #fff; box-shadow: 0 2px 14px rgba(0, 0, 0, .35); }
  .vpage::before { content: attr(data-p); position: absolute; inset: 0; display: grid; place-items: center; font: 600 28px var(--mono); color: #c4c7cd; }
  .vpage img { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .vpage .hl { position: absolute; z-index: 1; background: rgba(255, 208, 0, .42); mix-blend-mode: multiply; border-radius: 2px; pointer-events: none; }
  .vnote { font-size: 12px; color: var(--warn); }

  @media (max-width: 1080px) {
    html, body { height: auto; }
    .app { height: auto; display: block; }
    .sources { border-right: 0; border-bottom: 1px solid var(--line); }
    .thread { overflow: visible; padding: 20px 16px 8px; }
    .top, .composer { padding-left: 16px; padding-right: 16px; }
    .composer { position: sticky; bottom: 0; }
    .evidence { border-left: 0; border-top: 1px solid var(--line); }
    #evList { overflow: visible; }
  }
</style>
</head>
<body>
<div class="app">
  <aside class="sources">
    <h2 class="pane">자료</h2>
    <div id="srcList"></div>
    <p class="hint">체크한 자료 안에서만 검색하고 답합니다. 인용 우선순위는 번호 순(ESC → KSHF → AHA)이며, 자료에 없는 내용은 답하지 않습니다.</p>
  </aside>

  <main>
    <div class="top">
      <h1>심부전 노트북</h1>
      <p id="sub">자료 기반 질의응답 · 모든 문장에 근거 번호가 붙습니다</p>
    </div>
    <div class="thread" id="thread">
      <div class="empty" id="empty">
        <h3>자료에게 물어보세요</h3>
        <div>선택한 진료지침에서 찾은 근거만으로 답하고, 오른쪽에 발췌문 전문을 보여줍니다.</div>
        <div class="chips" id="chips"></div>
      </div>
    </div>
    <form class="composer" id="form">
      <div class="box">
        <textarea id="q" rows="1" maxlength="2000" placeholder="자료에 대해 질문하세요  (Enter 전송, Shift+Enter 줄바꿈)"></textarea>
        <button class="send" id="send" type="submit">질문</button>
      </div>
      <div class="note">각 질문은 이전 대화와 무관하게 독립적으로 답변합니다. 의학적 조언이 아닌 자료 요약입니다.</div>
    </form>
  </main>

  <aside class="evidence">
    <div class="head">
      <h2 class="pane">근거</h2>
      <p id="evMeta">답변을 선택하면 근거 발췌문이 여기에 표시됩니다.</p>
    </div>
    <div id="evList"></div>
  </aside>
</div>

<dialog id="viewer" class="viewer">
  <div class="vbar">
    <div class="vt"><b id="vTitle"></b><span id="vPageNo"></span> <span class="vnote" id="vNote"></span></div>
    <button class="vbtn" id="vHl" type="button" title="인용된 부분 형광펜">형광펜</button>
    <button class="vbtn" id="vJump" type="button" title="인용된 위치로 이동">인용 위치로</button>
    <button class="vbtn" id="vZoomOut" type="button" aria-label="축소">−</button>
    <button class="vbtn" id="vZoomIn" type="button" aria-label="확대">+</button>
    <button class="vbtn" id="vClose" type="button" aria-label="닫기">✕</button>
  </div>
  <div class="vbody" id="vBody"><div class="vbox" id="vBox"></div></div>
</dialog>

<script>
const EXAMPLES = [
  "HFrEF 환자에서 베타차단제의 역할은?",
  "NT-proBNP는 심부전 진단에 어떻게 쓰이나요?",
  "SGLT2 억제제는 어떤 환자에게 권고되나요?",
  "What is the recommendation for ICD in HFrEF?",
  "NOAC별 허가용량과 주의사항을 표로 알려줘",
  "수면무호흡과 심부전의 관계는?",
];
const $ = (id) => document.getElementById(id);
const esc = (s) => s.replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

let SOURCES = [], PUBLIC = false, VIEWER = true;
const selected = new Set();
const turns = [];
let current = -1, busy = false;

/* ---------- 자료 목록 ---------- */
function renderSources() {
  $("srcList").innerHTML = SOURCES.map((s) => `
    <label class="src ${selected.has(s.id) ? "on" : ""}">
      <input type="checkbox" data-id="${esc(s.id)}" ${selected.has(s.id) ? "checked" : ""}>
      <span><b><span class="pri">${s.priority ?? ''}</span>${esc(s.name)}</b><small>${s.pages}쪽 · 발췌 ${s.chunks}개(표 ${s.tables}) · ${s.lang === "ko" ? "한국어" : "English"}</small></span>
    </label>`).join("");
}
$("srcList").addEventListener("change", (ev) => {
  const id = ev.target.dataset.id;
  if (ev.target.checked) selected.add(id); else selected.delete(id);
  if (!selected.size) { selected.add(id); }
  renderSources();
});

/* ---------- 렌더링 ---------- */
const inline = (s) => esc(s)
  .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
  .replace(/\[(\d+)\]/g, '<button type="button" class="cite" data-n="$1">$1</button>');

function answerTable(lines) {
  const rows = lines.map((l) => l.trim().replace(/^\||\|$/g, "").split("|").map((c) => c.trim()))
    .filter((r) => !r.every((c) => /^:?-{3,}:?$/.test(c)));
  const [head, ...body] = rows;
  return `<div class="tbl"><div class="twrap"><table><thead><tr>${head.map((c) => `<th>${inline(c)}</th>`).join("")}</tr></thead>` +
    `<tbody>${body.map((r) => `<tr>${r.map((c) => `<td>${inline(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div></div>`;
}

function renderAnswer(text, streaming) {
  // 본문은 줄바꿈 그대로, "|" 로 시작하는 연속 줄은 표로 그린다 (사용자가 표를 요청한 경우)
  const out = [];
  let buf = [], tbl = [];
  const flushText = () => { if (buf.length) { out.push(`<span>${inline(buf.join("\n"))}</span>`); buf = []; } };
  const flushTable = () => { if (tbl.length) { out.push(answerTable(tbl)); tbl = []; } };
  for (const ln of text.split("\n")) {
    if (/^\s*\|/.test(ln)) { flushText(); tbl.push(ln); } else { flushTable(); buf.push(ln); }
  }
  flushText(); flushTable();
  return out.join("") + (streaming ? '<span class="typing"></span>' : "");
}

function renderMarked(text, spans) {
  // 답변이 실제로 근거로 삼은 문장만 강조 (spans: JS(UTF-16) 오프셋 쌍)
  if (!spans || !spans.length) return esc(text);
  let out = "", pos = 0;
  for (const [a, b] of [...spans].sort((x, y) => x[0] - y[0])) {
    if (a < pos) continue;
    out += esc(text.slice(pos, a)) + `<mark class="key">${esc(text.slice(a, b))}</mark>`;
    pos = b;
  }
  return out + esc(text.slice(pos));
}

function renderTable(text, hitUnits) {
  // 서버가 만든 마크다운 표(셀 안의 | 는 / 로 치환됨)를 <table> 로 그린다
  const lines = text.split("\n").filter((l) => l.trim());
  let cap = "";
  if (lines[0] && lines[0].startsWith("**")) cap = lines.shift().replace(/^\*\*|\*\*$/g, "");
  const rows = lines.filter((l) => l.startsWith("|") && !/^\|(\s*---\s*\|)+\s*$/.test(l))
    .map((l) => l.replace(/^\||\|$/g, "").split("|").map((c) => c.trim()));
  if (!rows.length) return `<div class="ptext">${esc(text)}</div>`;
  const hit = new Set(hitUnits || []); // 0 = 머리글 행, 1.. = 본문 행 (서버의 단위 번호와 같다)
  const [head, ...body] = rows;
  return `<div class="tbl">${cap ? `<div class="cap">${esc(cap)}</div>` : ""}<div class="twrap"><table>
    <thead><tr class="${hit.has(0) ? "hit" : ""}">${head.map((c) => `<th>${esc(c)}</th>`).join("")}</tr></thead>
    <tbody>${body.map((r, k) => `<tr class="${hit.has(k + 1) ? "hit" : ""}">${r.map((c) => `<td>${esc(c)}</td>`).join("")}</tr>`).join("")}</tbody>
  </table></div></div>`;
}

function renderEvidence() {
  const t = turns[current];
  if (!t || !t.passages) { $("evList").innerHTML = ""; return; }
  const marks = t.marks || {};
  const card = (p) => {
    const cited = t.cited.includes(p.n);
    const mk = cited ? marks[p.n] : null;
    return `<article class="pcard ${cited ? "cited" : ""}" id="p-${current}-${p.n}">
      <div class="phead"><span class="num">${p.n}</span><span class="sname">${esc(p.source_name)}</span><span>p.${p.page}</span>${p.kind === "table" ? '<span class="kind">표</span>' : ""}<span class="rel">관련도 ${p.score.toFixed(2)}</span></div>
      ${p.kind === "table" ? renderTable(p.text, mk && mk.units) : `<div class="ptext">${renderMarked(p.text, mk && mk.spans)}</div>`}
      ${VIEWER ? `<div class="pfoot"><button type="button" class="open-src" data-id="${p.id}">원문 PDF에서 보기</button></div>` : ""}
    </article>`;
  };
  const cited = t.passages.filter((p) => t.cited.includes(p.n));
  const others = t.passages.filter((p) => !t.cited.includes(p.n));
  let html = "";
  if (t.refused) html += `<div class="sub">관련도가 낮은 가장 가까운 발췌문 (답변에 사용하지 않음)</div>` + others.map(card).join("");
  else {
    if (cited.length) html += `<div class="sub">답변에 인용됨 (${cited.length})</div>` + cited.map(card).join("");
    if (others.length) html += `<div class="sub">검토했지만 인용되지 않음 (${others.length})</div>` + others.map(card).join("");
  }
  $("evList").innerHTML = html || '<div class="noev">검색된 발췌문이 없습니다.</div>';
  $("evMeta").textContent = t.refused ? "자료에서 관련 내용을 찾지 못했습니다."
    : `${t.passages.length}개 발췌문 검토 · ${t.cited.length}개 인용 · 질문: ${t.q.slice(0, 40)}${t.q.length > 40 ? "…" : ""}`;
}

function renderTurn(i) {
  const t = turns[i], el = $("turn-" + i);
  const body = t.error ? `<div class="err">${esc(t.error)}</div>`
    : t.answer === null && !t.partial ? `<div class="status"><div class="spin"></div>${esc(t.stage)}</div>`
    : `<div class="a ${t.refused ? "refused" : ""}">${renderAnswer(t.answer ?? t.partial, t.answer === null)}</div>`;
  const meta = t.done ? `<div class="meta"><span>${t.refused ? "근거 없음" : `${t.cited.length}개 문단 인용`} · ${t.seconds}초</span>
      <button type="button" class="view" data-i="${i}">근거 보기</button></div>` : "";
  el.innerHTML = `<div class="q">${esc(t.q)}</div>${body}${meta}`;
  el.classList.toggle("sel", i === current);
}

function select(i) {
  const prev = current; current = i;
  if (prev >= 0 && prev !== i) renderTurn(prev);
  renderTurn(i); renderEvidence();
}

/* ---------- 질문 ---------- */
async function ask(query) {
  if (busy) return;
  busy = true; $("send").disabled = true; $("empty")?.remove();
  const i = turns.length;
  turns.push({ q: query, answer: null, partial: "", stage: "자료에서 근거를 찾는 중…", passages: null, cited: [], done: false });
  const div = document.createElement("div");
  div.className = "turn"; div.id = "turn-" + i;
  $("thread").appendChild(div);
  select(i);
  div.scrollIntoView({ behavior: "smooth", block: "start" });
  const t = turns[i];
  try {
    const res = await fetch("/api/ask", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ query, sources: [...selected] }),
    });
    if (!res.ok) {
      let msg = (await res.text()).slice(0, 200);
      try { const j = JSON.parse(msg); if (typeof j.detail === "string") msg = j.detail; } catch (_) {}
      throw new Error(msg);
    }
    const reader = res.body.getReader(), dec = new TextDecoder();
    let buf = "";
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let nl;
      while ((nl = buf.indexOf("\n")) >= 0) {
        const line = buf.slice(0, nl).trim(); buf = buf.slice(nl + 1);
        if (!line) continue;
        const ev = JSON.parse(line);
        if (ev.type === "passages") {
          t.passages = ev.passages; t.refused = ev.refused; t.stage = "답변 작성 중…";
          if (current === i) renderEvidence();
        } else if (ev.type === "token") {
          t.partial += ev.t;
          t.cited = [...new Set([...t.partial.matchAll(/\[(\d+)\]/g)].map((m) => +m[1]))];
        } else if (ev.type === "done") {
          if (ev.passages) t.passages = ev.passages;
          t.answer = ev.answer; t.cited = ev.cited; t.marks = ev.marks || {}; t.refused = ev.refused; t.seconds = ev.seconds; t.done = true;
          if (ev.refused && ev.hint) t.answer = ev.answer + "\n\n" + ev.hint;
        } else if (ev.type === "error") { t.error = ev.message; }
        renderTurn(i);
        if (ev.type === "done" && current === i) renderEvidence();
      }
    }
  } catch (e) {
    t.error = String(e.message || e); renderTurn(i);
  }
  busy = false; $("send").disabled = false; $("q").focus();
}

/* ---------- 이벤트 ---------- */
$("form").addEventListener("submit", (ev) => {
  ev.preventDefault();
  const q = $("q").value.trim();
  if (!q) return;
  $("q").value = ""; $("q").style.height = "auto";
  ask(q);
});
$("q").addEventListener("keydown", (ev) => {
  if (ev.key === "Enter" && !ev.shiftKey && !ev.isComposing) { ev.preventDefault(); $("form").requestSubmit(); }
});
$("q").addEventListener("input", () => { $("q").style.height = "auto"; $("q").style.height = Math.min($("q").scrollHeight, 140) + "px"; });

$("thread").addEventListener("click", (ev) => {
  const view = ev.target.closest(".view");
  if (view) { select(+view.dataset.i); return; }
  const c = ev.target.closest(".cite");
  if (c) {
    const i = +c.closest(".turn").id.slice(5);
    if (i !== current) select(i);
    const card = $(`p-${i}-${c.dataset.n}`);
    if (card) { card.scrollIntoView({ behavior: "smooth", block: "center" }); card.classList.remove("flash"); void card.offsetWidth; card.classList.add("flash"); }
    const ps = (turns[i].passages || []).find((x) => x.n === +c.dataset.n);
    if (ps && VIEWER) openViewer(ps.id, (turns[i].marks || {})[ps.n]);
  }
});

$("evList").addEventListener("click", (ev) => {
  const b = ev.target.closest(".open-src");
  if (!b) return;
  const t = turns[current], p = (t.passages || []).find((x) => x.id === +b.dataset.id);
  openViewer(+b.dataset.id, p && t.cited.includes(p.n) ? (t.marks || {})[p.n] : null);
});

/* ---------- 원문 PDF 뷰어 (연속 스크롤) ---------- */
const V = { info: null, sizes: [], zoom: 1, hl: true, io: null, starts: [], cur: 0, expected: false };
const PAD = 16; // .vbody 의 padding

async function openViewer(id, mk) {
  const units = mk && mk.units && mk.units.length ? mk.units.join(",") : "";
  const res = await fetch(`/api/locate?id=${id}${units ? `&units=${units}` : ""}`);
  if (!res.ok) { await viewerError(res); return; }
  const info = await res.json();
  const sz = await fetch(`/api/pagesizes?source=${encodeURIComponent(info.source)}`);
  if (!sz.ok) { await viewerError(sz); return; }
  V.info = info; V.expected = !!units; V.sizes = (await sz.json()).sizes; V.zoom = 1; V.hl = true;
  $("vHl").classList.add("on");
  $("vTitle").textContent = info.name;
  $("viewer").showModal();
  buildPages();
  scrollToCited(false);
}

async function viewerError(res) {
  let msg = "원문을 불러오지 못했습니다.";
  try { const j = await res.json(); if (typeof j.detail === "string") msg = j.detail; } catch (_) {}
  alert(msg);
}

function sizeViewerBox() {
  $("vBox").style.width = Math.round(Math.min($("vBody").clientWidth - 2 * PAD, 900) * V.zoom) + "px";
}

function measurePages() {
  V.starts = [...$("vBox").children].map((c) => c.offsetTop);
}

function buildPages() {
  const box = $("vBox");
  box.innerHTML = "";
  sizeViewerBox();
  if (V.io) V.io.disconnect();
  // 보이는 쪽 근처만 이미지를 불러온다 (나머지는 크기만 잡힌 빈 쪽)
  V.io = new IntersectionObserver((entries) => {
    for (const e of entries) {
      if (!e.isIntersecting || e.target.querySelector("img")) continue;
      const img = document.createElement("img");
      img.alt = `p.${e.target.dataset.p}`; img.decoding = "async";
      img.src = `/api/pdfpage?source=${encodeURIComponent(V.info.source)}&page=${e.target.dataset.p}`;
      e.target.appendChild(img);
    }
  }, { root: $("vBody"), rootMargin: "1600px 0px" });
  V.sizes.forEach(([w, h], i) => {
    const d = document.createElement("div");
    d.className = "vpage"; d.dataset.p = i + 1; d.style.aspectRatio = `${w} / ${h}`;
    box.appendChild(d); V.io.observe(d);
  });
  drawHighlights();
  measurePages();
  updateIndicator();
}

function drawHighlights() {
  const i = V.info, pageEl = $("vBox").children[i.page - 1];
  pageEl.querySelectorAll(".hl").forEach((n) => n.remove());
  $("vNote").textContent = i.rects.length ? "" : V.expected ? "정확한 문장 위치를 찾지 못해 해당 쪽만 표시합니다." : "답변에 인용되지 않은 발췌문입니다 (형광펜 없음).";
  if (!V.hl) return;
  for (const [x0, y0, x1, y1] of i.rects) {
    const d = document.createElement("div");
    d.className = "hl";
    d.style.cssText = `left:${(x0 / i.w) * 100}%;top:${(y0 / i.h) * 100}%;width:${((x1 - x0) / i.w) * 100}%;height:${((y1 - y0) / i.h) * 100}%`;
    pageEl.appendChild(d);
  }
}

function scrollToCited(smooth) {
  const i = V.info, pageEl = $("vBox").children[i.page - 1];
  const top = pageEl.offsetTop + (i.focus != null ? (i.focus / i.h) * pageEl.offsetHeight - 90 : -10);
  $("vBody").scrollTo({ top: Math.max(0, top), behavior: smooth ? "smooth" : "auto" });
}

function updateIndicator() {
  const mid = $("vBody").scrollTop + $("vBody").clientHeight / 3 - PAD;
  let lo = 0, hi = V.starts.length - 1;
  while (lo < hi) { const m = (lo + hi + 1) >> 1; if (V.starts[m] <= mid) lo = m; else hi = m - 1; }
  V.cur = lo;
  $("vPageNo").textContent = `p.${lo + 1} / ${V.info.total}${lo + 1 === V.info.page ? (V.expected ? " · 인용된 쪽" : " · 발췌문 쪽") : ""}`;
}

function setZoom(z) {
  const body = $("vBody"), box = $("vBox"), before = box.offsetWidth;
  V.zoom = Math.max(0.5, Math.min(1.6, z));
  sizeViewerBox();
  body.scrollTop *= box.offsetWidth / before;
  measurePages(); updateIndicator();
}

let scrollTick = false;
$("vBody").addEventListener("scroll", () => {
  if (scrollTick) return;
  scrollTick = true;
  requestAnimationFrame(() => { scrollTick = false; if (V.info) updateIndicator(); });
});
$("vJump").addEventListener("click", () => scrollToCited(true));
$("vZoomIn").addEventListener("click", () => setZoom(V.zoom + 0.2));
$("vZoomOut").addEventListener("click", () => setZoom(V.zoom - 0.2));
$("vHl").addEventListener("click", () => { V.hl = !V.hl; $("vHl").classList.toggle("on", V.hl); drawHighlights(); });
$("vClose").addEventListener("click", () => $("viewer").close());
$("viewer").addEventListener("click", (ev) => { if (ev.target === $("viewer")) $("viewer").close(); });
$("viewer").addEventListener("close", () => { if (V.io) V.io.disconnect(); $("vBox").innerHTML = ""; });
window.addEventListener("resize", () => { if ($("viewer").open && V.info) { sizeViewerBox(); measurePages(); updateIndicator(); } });

$("chips").innerHTML = EXAMPLES.map((e, i) => `<button type="button" class="chip" data-i="${i}">${esc(e)}</button>`).join("");
$("chips").addEventListener("click", (ev) => {
  const c = ev.target.closest(".chip");
  if (c) ask(EXAMPLES[+c.dataset.i]);
});

fetch("/api/info").then((r) => r.json()).then((i) => {
  SOURCES = i.sources; PUBLIC = i.public; VIEWER = i.viewer !== false;
  SOURCES.forEach((s) => selected.add(s.id));
  renderSources();
  $("sub").textContent = `자료 기반 질의응답 · ${i.llm.split("/").pop()} · 모든 문장에 근거 번호가 붙습니다`;
}).catch(() => {});
</script>
</body>
